name: OpenRouter authentication check
on:
  push:
    branches: [flow/openrouter-authcheck-20261124]
    paths: [.github/workflows/openrouter-auth-check.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check key and one minimal model call
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ.get('OPENROUTER_API_KEY', '')
          def safe(value):
              s = json.dumps(value, ensure_ascii=True)
              return s.replace(key, '[REDACTED]') if key else s
          def request(url, data=None):
              headers = {'Authorization': 'Bearer ' + key}
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=None if data is None else json.dumps(data).encode(), headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status, body = response.status, response.read()
              except urllib.error.HTTPError as e:
                  status, body = e.code, e.read()
              except Exception as e:
                  print('request_error=' + safe(str(e)))
                  return None, {}
              try:
                  parsed = json.loads(body)
                  return status, parsed if isinstance(parsed, dict) else {}
              except (ValueError, UnicodeDecodeError):
                  return status, {}
          status, result = request('https://openrouter.ai/api/v1/key')
          print('key_status=' + safe(status))
          data = result.get('data') or {}
          if not isinstance(data, dict): data = {}
          for field in ('limit', 'usage', 'label'):
              print('key_' + field + '=' + safe(data.get(field)))
          if result.get('error') is not None:
              print('key_error=' + safe(result['error']))
          if status == 200:
              payload = {'model':'z-ai/glm-5.3-flash', 'messages':[{'role':'user','content':'Say hello.'}], 'max_tokens':8, 'usage':{'include':True}}
              status, result = request('https://openrouter.ai/api/v1/chat/completions', payload)
              print('chat_status=' + safe(status))
              print('chat_usage=' + safe(result.get('usage')))
              if result.get('error') is not None:
                  print('chat_error=' + safe(result['error']))
          PY
