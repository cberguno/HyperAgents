name: Weekly isolation adversarial check
on:
  push:
    branches: [task/weekly-trading-handoff]
    paths: ['.github/workflows/weekly-isolation-check.yml', 'domains/weekly_trading/isolation_probe.py', 'domains/weekly_trading/isolation-check.sh']
  workflow_dispatch:
permissions: {}
jobs:
  hostile-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compare constrained candidate to hostile negative control
        run: bash domains/weekly_trading/isolation-check.sh
